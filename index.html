<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Controle de Mão de Obra Seatrade</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: painel lateral fixo (navegação) + área de trabalho; no celular a navegação vira gaveta. */
:root{
  --bg:#EEF2F5; --surface:#FFFFFF; --surface-2:#E6ECF1; --ink:#14222F; --muted:#5A6B7B; --line:#D3DCE4;
  --accent:#0A6C78; --accent-ink:#FFFFFF; --accent-soft:#D9ECEE;
  --signal:#B8670F; --signal-soft:#FBEAD5;
  --ok:#22744A; --ok-soft:#DCF0E3; --bad:#B0281F; --bad-soft:#F8DEDB;
  --nav:#0E2131; --nav-ink:#C4D3E0; --nav-dim:#7F95A8; --nav-hi:#1A3448;
  --shadow:0 1px 2px rgba(16,34,49,.06),0 8px 24px rgba(16,34,49,.08);
  --f-display:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
  --r:12px;
  --shadow-sm:0 1px 2px rgba(16,34,49,.05),0 2px 8px rgba(16,34,49,.05);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0C151E; --surface:#13202D; --surface-2:#1A2A39; --ink:#E4ECF2; --muted:#93A5B5; --line:#253848;
  --accent:#43B4C0; --accent-ink:#03232A; --accent-soft:#103940;
  --signal:#EFA24E; --signal-soft:#3B2915;
  --ok:#5CC48A; --ok-soft:#14321F; --bad:#F2857B; --bad-soft:#3C1A17;
  --nav:#070F17; --nav-ink:#AFC1D1; --nav-dim:#6A8093; --nav-hi:#13283A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); --shadow-sm:0 1px 2px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C151E; --surface:#13202D; --surface-2:#1A2A39; --ink:#E4ECF2; --muted:#93A5B5; --line:#253848;
  --accent:#43B4C0; --accent-ink:#03232A; --accent-soft:#103940;
  --signal:#EFA24E; --signal-soft:#3B2915;
  --ok:#5CC48A; --ok-soft:#14321F; --bad:#F2857B; --bad-soft:#3C1A17;
  --nav:#070F17; --nav-ink:#AFC1D1; --nav-dim:#6A8093; --nav-hi:#13283A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); --shadow-sm:0 1px 2px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--f-display);font-weight:600;letter-spacing:.01em;text-wrap:balance;margin:0}
h1{font-size:1.75rem;line-height:1.15}
h2{font-size:1.2rem}
h3{font-size:1rem}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num{text-align:right;white-space:nowrap}
.muted{color:var(--muted)}
.rot{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* ---------- Login ---------- */
/* Foto de fundo do login (arquivo fundo-login.jpg ao lado do index.html) ocupando a tela inteira;
   escurecida embaixo e nas laterais para o texto ler bem. O formulário fica num cartão por cima da foto. */
.login{min-height:100vh;min-height:100dvh;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);
  background:linear-gradient(to top,rgba(9,22,33,.92) 0%,rgba(9,22,33,.55) 38%,rgba(9,22,33,0) 72%),
    linear-gradient(to right,rgba(9,22,33,.45) 0%,rgba(9,22,33,0) 45%,rgba(9,22,33,0) 60%,rgba(9,22,33,.4) 100%),
    url('fundo-login.jpg') center 30%/cover no-repeat,var(--nav)}
.login-marca{color:var(--nav-ink);display:flex;flex-direction:column;justify-content:flex-end;gap:32px;
  padding-block:48px;padding-left:max(48px,env(safe-area-inset-left,0px));padding-right:40px}
.login-marca p,.login-marca h1{text-shadow:0 1px 3px rgba(0,0,0,.5)}
.login-marca h1{color:#fff;font-size:clamp(2rem,4vw,3rem);font-weight:700;max-width:12ch}
.login-marca p{max-width:42ch;color:var(--nav-ink)}
.dia-op{display:grid;gap:8px;max-width:520px}
.dia-op .faixa{display:grid;grid-template-columns:repeat(4,1fr);gap:3px}
.dia-op .seg{padding:10px 8px;font:500 .9rem var(--f-mono);color:#fff;background:#1C3B52;border-radius:4px;text-align:center}
.dia-op .seg.n{background:#132B3D;color:var(--nav-ink)}
.dia-op .doze{display:grid;grid-template-columns:1fr 1fr;gap:3px}
.dia-op .doze span{padding:6px 8px;font:500 .8rem var(--f-mono);border:1px dashed #36556D;border-radius:4px;text-align:center;color:var(--nav-ink)}
.login-form{display:flex;align-items:center;justify-content:center;padding-block:40px;padding-left:24px;padding-right:max(24px,env(safe-area-inset-right,0px))}
.login-form form{width:100%;max-width:380px;display:grid;gap:16px;padding:32px 30px;border-radius:16px;
  background:var(--surface);background:color-mix(in srgb,var(--surface) 90%,transparent);
  -webkit-backdrop-filter:blur(14px) saturate(1.2);backdrop-filter:blur(14px) saturate(1.2);
  border:1px solid rgba(255,255,255,.35);box-shadow:0 2px 6px rgba(0,0,0,.12),0 24px 60px rgba(0,0,0,.35)}
.login-form form h2{font-size:1.5rem}
.login-form .btn.primario{padding:12px 14px;font-size:1rem}
.demo-box{border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:10px;background:var(--surface)}
.demo-box .linha{display:flex;gap:8px;flex-wrap:wrap}
@media (max-width:820px){
  .login{grid-template-columns:1fr;grid-template-rows:auto 1fr;
    background:linear-gradient(to bottom,rgba(9,22,33,0) 0%,rgba(9,22,33,.35) 30%,rgba(9,22,33,.85) 60%,rgba(9,22,33,.95) 100%),
      url('fundo-login.jpg') center top/auto 62vh no-repeat,var(--nav)}
  .login-marca{padding-top:max(150px,26vh);padding-bottom:16px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));gap:12px}
  .login-marca h1{font-size:1.6rem;max-width:none}
  .login-marca p,.login-marca .dia-op{display:none}
  .login-form{align-items:flex-start;padding-top:4px;padding-bottom:max(24px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .login-form form{padding:24px 20px}
}

/* ---------- Shell ---------- */
.shell{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100%}
.nav{background:var(--nav);color:var(--nav-ink);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;
  padding-block:20px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:14px}
.nav .marca{font:700 1.15rem var(--f-display);color:#fff;padding:4px 10px 18px;letter-spacing:.02em}
.nav .marca small{display:block;font:400 .75rem var(--f-body);color:var(--nav-dim);letter-spacing:0}
.nav .grupo{font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--nav-dim);padding:16px 10px 6px;font-weight:600}
.nav a{display:block;color:var(--nav-ink);text-decoration:none;padding:8px 10px;border-radius:6px;font-size:.93rem}
.nav a:hover{background:var(--nav-hi);color:#fff}
.nav a.ativo{background:var(--nav-hi);color:#fff;box-shadow:inset 3px 0 0 var(--accent)}
.nav .rodape{margin-top:auto;padding:16px 10px 0;border-top:1px solid #1E3447;display:grid;gap:8px}
.nav .rodape b{color:#fff;font-weight:500}
.nav .rodape button{background:none;border:1px solid #2A445A;color:var(--nav-ink);border-radius:6px;padding:7px 10px;cursor:pointer;text-align:left}
.nav .rodape button:hover{border-color:var(--nav-ink)}
.topo{display:none}
main{min-width:0;padding-block:28px 64px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
.conteudo{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);gap:20px}
.conteudo>*{min-width:0}
.faixa-demo{background:var(--signal-soft);color:var(--ink);border:1px solid var(--signal);border-radius:var(--r);padding:8px 12px;font-size:.88rem;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.faixa-demo b{color:var(--signal)}
@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .nav{position:fixed;inset:0 auto 0 0;width:min(280px,86vw);z-index:40;transform:translateX(-102%);transition:transform .2s;height:100%;
    padding-top:calc(20px + env(safe-area-inset-top,0px))}
  .shell.aberto .nav{transform:none}
  .veu{position:fixed;inset:0;background:rgba(5,12,18,.5);z-index:30}
  .topo{display:flex;align-items:center;gap:12px;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--nav);color:#fff;
    padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--nav)}
  .topo button{background:none;border:0;color:#fff;padding:6px;cursor:pointer;display:grid}
  .topo b{font-family:var(--f-display);font-size:1.05rem;font-weight:600}
  main{padding-block:18px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  h1{font-size:1.45rem}
}
@media (prefers-reduced-motion:reduce){.nav{transition:none}}

/* ---------- Componentes ---------- */
.cab{display:flex;justify-content:space-between;align-items:flex-end;gap:12px 20px;flex-wrap:wrap}
.cab p{margin:4px 0 0;color:var(--muted)}
.acoes{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 14px;border-radius:6px;border:1px solid var(--line);
  background:var(--surface);color:var(--ink);font-weight:500;font-size:.92rem;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primario{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primario:hover{filter:brightness(1.08)}
.btn.perigo{color:var(--bad);border-color:var(--bad)}
.btn.ok{color:var(--ok);border-color:var(--ok)}
.btn.peq{padding:5px 10px;font-size:.84rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
.painel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.painel>h2{margin-bottom:12px}
.painel .cab-p{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.filtros{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.filtros .campo{min-width:140px;flex:1 1 140px;max-width:240px}
.campo{display:grid;gap:4px}
.campo label{font-size:.8rem;font-weight:600;color:var(--muted)}
.campo input,.campo select,.campo textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);min-height:40px}
.campo textarea{min-height:72px;resize:vertical}
.campo input:focus,.campo select:focus,.campo textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
.check{display:flex;gap:8px;align-items:center;font-size:.92rem;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--accent)}
.grade{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.tab-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
/* Lista de requisições: tabela no computador, cartões no celular */
.cards-req{display:none;gap:10px}
.card-req{display:block;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);color:inherit;text-decoration:none}
.card-req .l1,.card-req .l3{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.card-req .l2{margin:6px 0;font-weight:600;overflow-wrap:anywhere}
.card-req .l3{font-size:.85rem;color:var(--muted)}
.cards-req .rodape-c{font-size:.85rem;color:var(--muted);padding:2px 4px}
@media (max-width:640px){.lista-req .tab-wrap{display:none}.lista-req .cards-req{display:grid}}
table.tab{width:100%;border-collapse:collapse;font-size:.9rem}
.tab th{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
.tab td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tab tbody tr:last-child td{border-bottom:0}
.tab tbody tr.click{cursor:pointer}
.tab tbody tr.click:hover td{background:var(--surface-2)}
.tab tfoot td{font-weight:600;background:var(--surface-2);border-top:1px solid var(--line)}
.tab th.num,.tab td.num{text-align:right}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:.75rem;font-weight:600;letter-spacing:.03em;white-space:nowrap}
.pill.ABERTA{background:var(--accent-soft);color:var(--accent)}
.pill.APROVADA{background:var(--ok-soft);color:var(--ok)}
.pill.CANCELADA{background:var(--bad-soft);color:var(--bad)}
.pill.EM_CONFERENCIA{background:var(--signal-soft);color:var(--signal)}
.pill.CONFERIDO{background:var(--accent-soft);color:var(--accent)}
.pill.PAGO{background:var(--ok-soft);color:var(--ok)}
.confere{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.confere .caixa{border:1px solid var(--line);border-radius:6px;padding:12px;display:grid;gap:2px;min-width:0}
.confere .caixa b{font:600 1.25rem var(--f-mono);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.confere .caixa.ok{border-color:var(--ok);background:var(--ok-soft)}
.confere .caixa.ok b{color:var(--ok)}
.confere .caixa.dif{border-color:var(--bad);background:var(--bad-soft)}
.confere .caixa.dif b{color:var(--bad)}
.nota{background:var(--surface-2);border-radius:6px;padding:10px 12px;font-size:.88rem}
.pill.inativo{background:var(--surface-2);color:var(--muted)}
.tag{display:inline-block;padding:1px 7px;border-radius:4px;font-size:.74rem;font-weight:600;white-space:nowrap}
.tag.DOM_FER{background:var(--signal-soft);color:var(--signal)}
.tag.UTIL{background:var(--surface-2);color:var(--muted)}
.turno{font-family:var(--f-mono);font-weight:500;background:var(--surface-2);padding:1px 6px;border-radius:4px;white-space:nowrap}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.86rem;cursor:pointer}
.chip[aria-pressed="true"],.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip-s{display:inline-block;font-size:.74rem;background:var(--surface-2);border-radius:4px;padding:1px 6px;margin:1px 2px 1px 0;white-space:nowrap}
.radio-chips{display:flex;gap:6px;flex-wrap:wrap}
.radio-chips label{position:relative}
.radio-chips input{position:absolute;opacity:0;inset:0}
.radio-chips span{display:block;border:1px solid var(--line);border-radius:6px;padding:8px 12px;font:500 .92rem var(--f-mono);cursor:pointer;background:var(--surface)}
.radio-chips small{display:block;font:400 .7rem var(--f-body);color:var(--muted)}
.radio-chips input:checked+span{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.radio-chips input:checked+span small{color:var(--accent-ink)}
.radio-chips input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.vazio{padding:28px;text-align:center;color:var(--muted)}
.carregando{padding:28px;text-align:center;color:var(--muted)}

/* KPIs e barras */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:4px;min-width:0}
.kpi b{font:600 1.45rem var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em;overflow-wrap:anywhere}
.kpi small{color:var(--muted);font-size:.8rem}
.kpi.alerta{border-color:var(--signal)}
.kpi.alerta b{color:var(--signal)}
.duas{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
@media (max-width:420px){.duas{grid-template-columns:1fr}}
.barras{display:grid;gap:10px}
.barra{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:baseline}
.barra .nome{font-size:.9rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.barra .val{font:500 .86rem var(--f-mono);font-variant-numeric:tabular-nums}
.barra .trilho{grid-column:1/-1;height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.barra .trilho i{display:block;height:100%;background:var(--accent);border-radius:4px}
.barra .sub{grid-column:1/-1;font-size:.76rem;color:var(--muted)}

/* Ficha da requisição */
.ficha{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px 20px}
.ficha div{display:grid;gap:2px;min-width:0}
.ficha dd{margin:0;font-weight:500;overflow-wrap:anywhere}
.ficha dt{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.reqnum{font-family:var(--f-mono);font-weight:500;white-space:nowrap}
.totais{display:flex;gap:18px;flex-wrap:wrap;font-size:.9rem}
.totais b{font-family:var(--f-mono)}
.grupo-func{margin-top:6px}
.grupo-func h3{font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
.lista-trab{display:grid;gap:6px}
.trab{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.trab .n{font-weight:500;overflow-wrap:anywhere}
.trab .d{font-size:.8rem;color:var(--muted)}
.trab .lado{display:flex;gap:10px;align-items:center}
.trab.bloq{opacity:.6}
.aviso{font-size:.78rem;color:var(--signal)}

/* Matriz de preços */
.matriz td.cel{cursor:pointer;font-family:var(--f-mono);text-align:right;white-space:nowrap}
.matriz td.cel:hover{background:var(--surface-2)}
.matriz td.cel.min{background:var(--ok-soft);color:var(--ok);font-weight:600}
.matriz td.cel.nada{color:var(--muted);text-align:center}
.seg-ctl{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.seg-ctl button{border:0;background:none;padding:8px 14px;cursor:pointer;font-weight:500}
.seg-ctl button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

/* Modal e aviso */
.modal-fundo{position:fixed;inset:0;background:rgba(5,12,18,.55);z-index:60;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;
  padding-block:calc(40px + env(safe-area-inset-top,0px)) 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.modal{background:var(--surface);border-radius:10px;box-shadow:var(--shadow);width:100%;max-width:560px;display:grid;gap:16px;padding:22px;border:1px solid var(--line)}
.modal .rodape{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.modal .rodape .dir{display:flex;gap:8px;margin-left:auto}
.erro{background:var(--bad-soft);color:var(--bad);border-radius:6px;padding:9px 12px;font-size:.88rem}
.toasts{position:fixed;z-index:80;bottom:calc(16px + env(safe-area-inset-bottom,0px));right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:8px;max-width:min(420px,calc(100vw - 32px))}

    r = [...r].sort((a, b) => (a[c] > b[c] ? 1 : a[c] < b[c] ? -1 : 0) * s);

function DemoDB(){

  const numerar = () => { S.numeracao = S.numeracao || {};
    for (const r of [...S.requisicoes].sort((a, b) => String(a.criado_em).localeCompare(String(b.criado_em)) || a.id - b.id))
      if (!r.numero) { const ano = +String(r.criado_em || new Date().toISOString()).slice(0, 4); r.numero_ano = ano; r.numero = S.numeracao[ano] = (S.numeracao[ano] || 0) + 1; } };

  function regraItem(row){
    const r = get('requisicoes', row.requisicao_id), t = get('turnos', r.turno_id), tb = get('trabalhadores', row.trabalhador_id);

    row.valor_unitario = p.valor;
    for (const i of S.requisicao_itens) {
      if (i.trabalhador_id !== row.trabalhador_id || i.id === row.id) continue;
      const r2 = get('requisicoes', i.requisicao_id);
      if (r2.data !== r.data || r2.status === 'CANCELADA') continue;

    return S.requisicao_itens.map(i => {
      const r = get('requisicoes', i.requisicao_id), tu = get('turnos', r.turno_id), na = get('navios', r.navio_id), tb = get('trabalhadores', i.trabalhador_id);

/* ========================= Banco SUPABASE (real) ========================= */
function SupaDB(cfg){
  const sb = window.supabase.createClient(cfg.url, cfg.key);
  const SEM_SELECT = ['requisicao_itens', 'trabalhador_funcoes'];
  const msg = e => {
    const m = e && e.message ? e.message : String(e);
    if (/duplicate key/i.test(m)) return 'Já existe um registro com esses dados.';
    if (/exclusion constraint|conflicting key value/i.test(m)) return 'Já existe preço vigente para essa combinação no período informado.';
    if (/foreign key/i.test(m)) return 'Registro em uso: não pode ser excluído. Inative em vez de excluir.';
    if (/invalid login/i.test(m)) return 'E-mail ou senha incorretos.';
    if (/permission denied|row-level security/i.test(m)) return 'Você não tem permissão para esta operação.';
    return m;
  };
  const erro = e => { throw new Error(msg(e)); };
  async function perfil(){
    const {data:{user}} = await sb.auth.getUser(); if (!user) return null;
    const {data, error} = await sb.from('usuarios').select('*').eq('id', user.id).maybeSingle(); if (error) erro(error);
    return data;
  }
  function aplicar(q, o){
    if (o.eq) for (const [k, v] of Object.entries(o.eq)) q = q.eq(k, v);
    if (o.gte) for (const [k, v] of Object.entries(o.gte)) q = q.gte(k, v);
    if (o.lte) for (const [k, v] of Object.entries(o.lte)) q = q.lte(k, v);
    if (o.order) for (const ord of [].concat(o.order)) { const [c, dir] = ord.split(' '); q = q.order(c, {ascending:dir !== 'desc'}); }
    return q;
  }
  return {
    modo: 'supabase',
    async list(t, o = {}){
      const lote = 1000, saida = [];
      for (let ini = 0; ; ini += lote) {
        let q = aplicar(sb.from(t).select('*'), o);
        const fim = o.limit ? Math.min(o.limit, ini + lote) - 1 : ini + lote - 1;
        const {data, error} = await q.range(ini, fim); if (error) erro(error);
        saida.push(...data);
        if (data.length < lote || (o.limit && saida.length >= o.limit)) break;
      }
      return saida;
    },
    async insert(t, row){
      let q = sb.from(t).insert(row); if (!SEM_SELECT.includes(t)) q = q.select();
      const {data, error} = await q; if (error) erro(error);
      return data ? data[0] : null;
    },
    async update(t, match, patch){
      const {error, count} = await sb.from(t).update(patch, {count:'exact'}).match(match); if (error) erro(error);
      if (!count) throw new Error('Você não tem permissão para alterar este registro.');
    },
    async remove(t, match){
      const {error, count} = await sb.from(t).delete({count:'exact'}).match(match); if (error) erro(error);
      if (!count) throw new Error('Você não tem permissão para excluir este registro.');
    },
    async login(email, senha){
      const {error} = await sb.auth.signInWithPassword({email:String(email).trim(), password:senha}); if (error) erro(error);
      const u = await perfil();
      if (!u || !u.ativo) { await sb.auth.signOut(); throw new Error('Seu acesso ainda não foi liberado pelo administrador.'); }
      return u;
    },
    async rpc(nome, args){ const {data, error} = await sb.rpc(nome, args); if (error) erro(error); return data; },
    async sessao(){ const {data:{session}} = await sb.auth.getSession(); if (!session) return null; const u = await perfil(); return u && u.ativo ? u : null; },
    async logout(){ await sb.auth.signOut(); },
    async criarUsuario({nome, email, senha, perfil}){
      // cliente separado para não derrubar a sessão do administrador
      const tmp = window.supabase.createClient(cfg.url, cfg.key, {auth:{persistSession:false, autoRefreshToken:false, detectSessionInUrl:false, storageKey:'controle-mo-cadastro'}});
      const {data, error} = await tmp.auth.signUp({email:email.trim(), password:senha, options:{data:{nome}}}); if (error) erro(error);
      const id = data.user && data.user.id; if (!id) throw new Error('Não foi possível criar o usuário.');
      try { await this.update('usuarios', {id}, {nome, perfil, ativo:true}); }
      catch (e) { throw new Error('O e-mail pode já estar cadastrado. Confira em Usuários ou no painel do Supabase.'); }
    }
  };
}

function modal(titulo, corpo, {okTxt = 'Salvar', onOk, extra, perigo} = {}){
  const f = document.createElement('div'); f.className = 'modal-fundo';
  f.innerHTML = `<form class="modal" novalidate role="dialog" aria-modal="true" aria-label="${esc(titulo)}">
    <h2>${esc(titulo)}</h2><div class="corpo" style="display:grid;gap:14px">${corpo}</div><div class="erro" hidden></div>
    <div class="rodape">${extra || ''}<div class="dir"><button type="button" class="btn" data-x>Fechar</button>${onOk ? `<button type="submit" class="btn ${perigo ? 'perigo' : 'primario'}">${esc(okTxt)}</button>` : ''}</div></div></form>`;
  document.body.appendChild(f);
  const fechar = () => { f.remove(); document.removeEventListener('keydown', esc_); };
  const esc_ = e => { if (e.key === 'Escape') fechar(); };
  document.addEventListener('keydown', esc_);
  f.addEventListener('mousedown', e => { if (e.target === f) fechar(); });
  $('[data-x]', f).onclick = fechar;
  const form = $('form', f), err = $('.erro', f);
  form.addEventListener('submit', async e => {
    e.preventDefault(); if (!onOk) return;
    err.hidden = true; const b = $('button[type=submit]', f); b.disabled = true;
    try { const r = await onOk(form); if (r !== false) fechar(); }
    catch (x) { err.textContent = x.message; err.hidden = false; }
    finally { b.disabled = false; }
  });
  const pri = $('input,select,textarea', form); if (pri) setTimeout(() => pri.focus(), 30);
  return {el:form, fechar, erro:m => { err.textContent = m; err.hidden = false; }};
}
function confirmar(titulo, texto, ok, fn, perigo){ modal(titulo, `<p style="margin:0">${esc(texto)}</p>`, {okTxt:ok, onOk:fn, perigo}); }
function campo(f, v){
  const id = 'c-' + f.k, req = f.req ? ' required' : '';
  if (f.type === 'bool') return `<label class="check"><input type="checkbox" id="${id}" ${v ?? f.def ? 'checked' : ''}> ${esc(f.l)}</label>`;
  const lab = `<label for="${id}">${esc(f.l)}${f.req ? ' *' : ''}</label>`;
  if (f.type === 'select') return `<div class="campo">${lab}<select id="${id}"${req}>${f.vazio ? `<option value="">${esc(f.vazio)}</option>` : ''}${f.opts().map(([k, t]) => `<option value="${esc(k)}" ${String(k) === String(v ?? '') ? 'selected' : ''}>${esc(t)}</option>`).join('')}</select></div>`;
  if (f.type === 'area') return `<div class="campo">${lab}<textarea id="${id}">${esc(v)}</textarea></div>`;
  return `<div class="campo">${lab}<input id="${id}" type="${f.type || 'text'}" value="${esc(v ?? '')}"${req}${f.step ? ` step="${f.step}"` : ''}${f.min != null ? ` min="${f.min}"` : ''}${f.max != null ? ` max="${f.max}"` : ''}${f.ph ? ` placeholder="${esc(f.ph)}"` : ''}></div>`;
}
function lerCampos(form, campos){
  const o = {};
  for (const f of campos) {
    const el = $('#c-' + f.k, form); if (!el) continue;
    let v = f.type === 'bool' ? el.checked : el.value.trim();
    if (f.req && v === '') throw new Error(`Preencha o campo "${f.l}".`);
    if (f.type === 'number' || f.num) v = v === '' ? null : Number(v);
    else if (f.type === 'select' && f.numerico) v = v === '' ? null : Number(v);
    else if (f.type !== 'bool' && v === '') v = null;
    if (f.upper && typeof v === 'string') v = v.toUpperCase();
    o[f.k] = v;
  }
  return o;
}

        <div class="l3" style="margin-top:4px"><span>${r.qtd_trabalhadores} trab. · ${esc(r.supervisor)}</span>${adm ? `<b style="color:var(--ink)">${brl(r.valor_total)}</b>` : ''}</div></a>`).join('')}
      <div class="rodape-c">${n0(rows.length)} requisições · ${n0(tot.reduce((s, r) => s + r.qtd_trabalhadores, 0))} trabalhadores${adm ? ' · ' + brl(tot.reduce((s, r) => s + Number(r.valor_total || 0), 0)) : ''} (canceladas fora dos totais)</div></div>`;
    $('#r-lista').classList.add('lista-req');
    $('#r-lista').innerHTML = rows.length ? cartoes + `<div class="tab-wrap"><table class="tab"><thead><tr><th>Nº</th><th>Data</th><th>Turno</th><th>Navio</th><th>Armazém</th><th class="num">Trab.</th>${adm ? '<th class="num">Total</th>' : ''}<th>Supervisor</th><th>Situação</th></tr></thead><tbody>
      ${rows.map(r => `<tr class="click" data-id="${r.id}"><td><a class="reqnum" href="#req-${r.id}">${reqNum(r.id)}</a></td>

        <td><span class="turno">${esc(r.turno)}</span></td><td>${esc(r.navio)}${r.viagem ? ` <span class="muted">· ${esc(r.viagem)}</span>` : ''}</td><td>${esc(r.armazem)}</td>
        <td class="num">${r.qtd_trabalhadores}</td>${adm ? `<td class="num">${brl(r.valor_total)}</td>` : ''}<td>${esc(r.supervisor)}</td><td><span class="pill ${r.status}">${STATUS[r.status]}</span>${r.em_fechamento ? ' <span class="pill CONFERIDO" title="Incluída em fechamento do financeiro">Fechada</span>' : ''}</td></tr>`).join('')}
      </tbody><tfoot><tr><td colspan="5">${n0(rows.length)} requisições (canceladas fora dos totais)</td><td class="num">${n0(tot.reduce((s, r) => s + r.qtd_trabalhadores, 0))}</td>${adm ? `<td class="num">${brl(tot.reduce((s, r) => s + Number(r.valor_total || 0), 0))}</td>` : ''}<td colspan="2"></td></tr></tfoot></table></div>`
      : `<div class="painel vazio">Nenhuma requisição nesse filtro.${podeRequisitar() ? ' <a href="#nova">Criar uma requisição</a>.' : ''}</div>`;
    $$('#r-lista tr.click').forEach(tr => tr.onclick = e => { if (e.target.tagName !== 'A') location.hash = 'req-' + tr.dataset.id; });
  }
  await carregar();
}

/* ===================== Espelho da requisição (PDF) =====================
   PDF A4 em vetor (leve, abre no WhatsApp), sem valores em R$.
   QR code com o link da requisição no sistema (só abre com login). */
const JSPDF_CDN = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
const QR_CDN = 'https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js';
function podeCompartilharArquivo(){
  try { return !!(navigator.canShare && navigator.canShare({files:[new File(['x'], 'teste.pdf', {type:'application/pdf'})]})); } catch (e) { return false; }
}
async function gerarEspelho(r, itens){
  if (!window.jspdf) await carregarScript(JSPDF_CDN);
  if (!window.qrcode) await carregarScript(QR_CDN);
  // Folha carta (Letter) na horizontal, layout compacto
  const doc = new window.jspdf.jsPDF({unit:'mm', format:'letter', orientation:'landscape'});
  const W = doc.internal.pageSize.getWidth(), H = doc.internal.pageSize.getHeight(), M = 12, num = reqNum(r.id);
  const link = location.origin + location.pathname + '#req-' + r.id;
  const AZUL = [20, 34, 47], CINZA = [90, 107, 123], LINHA = [211, 220, 228];
  const fonte = (s, b) => { doc.setFont('helvetica', b ? 'bold' : 'normal'); doc.setFontSize(s); };
  // corta o texto pela largura real (mm), com reticências
  const cabe = (s, larg, tam, b) => { fonte(tam, b); let t = String(s ?? ''); if (doc.getTextWidth(t) <= larg) return t;
    while (t.length > 1 && doc.getTextWidth(t + '…') > larg) t = t.slice(0, -1); return t.replace(/\s+$/, '') + '…'; };
  const txt = (s, x, y, o = {}) => { const tam = o.s || 9, larg = o.w; const t = larg ? cabe(s, larg, tam, o.b) : String(s ?? '');
    fonte(tam, o.b); doc.setTextColor(...(o.c || AZUL)); doc.text(t, x, y, o.a ? {align:o.a} : undefined); };

  // QR code em vetor (nítido em qualquer tela)
  const qr = window.qrcode(0, 'M'); qr.addData(link); qr.make();
  const n = qr.getModuleCount(), lado = 26, cel = lado / n, qx = W - M - lado, qy = 9;
  doc.setFillColor(0, 0, 0);
  for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) if (qr.isDark(i, j)) doc.rect(qx + j * cel, qy + i * cel, cel + 0.02, cel + 0.02, 'F');
  txt('Conferir no sistema', qx + lado / 2, qy + lado + 3.5, {s:6.5, c:CINZA, a:'center'});

  // Cabeçalho: título, número e situação
  txt('CONTROLE DE MÃO DE OBRA SEATRADE', M, 14, {s:8, b:1, c:CINZA});
  txt('Espelho de requisição de mão de obra', M, 21, {s:12, b:1});
  txt('Nº ' + num, M, 31, {s:19, b:1});
  fonte(19, 1); const xSt = M + doc.getTextWidth('Nº ' + num) + 6;
  const corSt = r.status === 'APROVADA' ? [22, 120, 70] : r.status === 'CANCELADA' ? [180, 35, 35] : [170, 110, 0];
  txt((STATUS[r.status] || r.status).toUpperCase() + (r.status === 'ABERTA' ? ' · aguardando aprovação' : ''), xSt, 30.5, {s:9.5, b:1, c:corSt});

  // Dados da requisição: 4 colunas entre o título e o QR
  const campos = [
    ['Navio', r.navio + (r.viagem ? ' · viagem ' + r.viagem : '')], ['Armazém / local', r.armazem],
    ['Data do dia operacional', fdata(r.data) + ' · ' + DIAS[dow(r.data)]], ['Turno', `${r.turno} · ${r.horas_turno}h ${r.periodo === 'NOTURNO' ? 'noturno' : 'diurno'} · ${TIPO_DIA[r.tipo_dia]}`],
    ['Supervisor', r.supervisor], ['Criada em', fdh(r.criado_em)],
    ['Aprovação', r.aprovado_em ? `${r.aprovado_por_nome || ''} · ${fdh(r.aprovado_em).slice(0, 10)}` : '—'], ['Trabalhadores', `${itens.length} · ${itens.reduce((s, i) => s + i.horas, 0)} horas-homem`]];
  doc.setDrawColor(...LINHA); doc.setLineWidth(0.3); doc.line(M, 38, qx - 4, 38);
  const larg = (qx - 4 - M) / 4;
  campos.forEach(([l, v], k) => { const x = M + (k % 4) * larg, y = 44 + Math.floor(k / 4) * 10;
    txt(l.toUpperCase(), x, y, {s:6.5, b:1, c:CINZA}); txt(v, x, y + 4.3, {s:9, w:larg - 3}); });
  let y = 62;
  const linhaTexto = (rot, valor) => { if (!valor) return; txt(rot.toUpperCase() + ':', M, y, {s:6.5, b:1, c:CINZA});
    fonte(6.5, 1); const x = M + doc.getTextWidth(rot.toUpperCase() + ':') + 2; txt(valor, x, y, {s:9, w:W - M - x}); y += 5.5; };
  linhaTexto('Observação', r.observacao);
  if (r.status === 'CANCELADA') linhaTexto('Motivo do cancelamento', r.motivo_cancelamento);

  // Resumo por função
  const porFuncao = [...itens.reduce((m, i) => m.set(i.funcao, (m.get(i.funcao) || 0) + 1), new Map())].map(([f, q]) => `${f}: ${q}`).join('   ·   ');
  doc.setFillColor(238, 242, 245); doc.roundedRect(M, y - 1, W - 2 * M, 7.5, 1.2, 1.2, 'F');
  txt(porFuncao, M + 3, y + 4, {s:8.5, b:1, w:W - 2 * M - 6});
  y += 13;

  // Lista de trabalhadores
  const col = [M, M + 9, M + 112, M + 186, W - M];
  const rot = (s, x, a) => txt(s, x, y, {s:7, b:1, c:CINZA, a});
  const cabecalho = () => { rot('#', col[0]); rot('TRABALHADOR', col[1]); rot('FUNÇÃO', col[2]); rot('EMPRESA', col[3]); rot('HORAS', col[4], 'right');
    y += 1.8; doc.setDrawColor(...LINHA); doc.line(M, y, W - M, y); y += 4.3; };
  cabecalho();
  const ordenados = [...itens].sort((a, b) => String(a.funcao).localeCompare(String(b.funcao)) || String(a.trabalhador).localeCompare(String(b.trabalhador), 'pt-BR'));
  ordenados.forEach((i, k) => {
    if (y > H - 16) { doc.addPage(); y = 16; txt('Nº ' + num + ' (continuação)', M, y, {s:10, b:1}); y += 8; cabecalho(); }
    txt(k + 1, col[0], y, {s:8.5, c:CINZA}); txt(i.trabalhador, col[1], y, {s:8.5, w:col[2] - col[1] - 4});
    txt(i.funcao, col[2], y, {s:8.5, w:col[3] - col[2] - 4}); txt(i.empresa, col[3], y, {s:8.5, w:col[4] - col[3] - 16});
    txt(i.horas + 'h', col[4], y, {s:8.5, a:'right'});
    y += 2; doc.setDrawColor(235, 239, 243); doc.line(M, y, W - M, y); y += 3.8;
  });

  // Rodapé em todas as páginas
  const total = doc.getNumberOfPages(), gerado = new Date().toLocaleString('pt-BR', {dateStyle:'short', timeStyle:'short'});
  for (let p = 1; p <= total; p++) { doc.setPage(p);
    doc.setDrawColor(...LINHA); doc.line(M, H - 10, W - M, H - 10);
    txt(`Gerado em ${gerado}${ME ? ' por ' + ME.nome : ''} · Documento sem valores · A situação válida é a do sistema (QR code).`, M, H - 6, {s:6.5, c:CINZA});
    txt(`Página ${p} de ${total}`, W - M, H - 6, {s:6.5, c:CINZA, a:'right'}); }

  const blob = doc.output('blob');
  return new File([blob], `Requisicao_${num.replace(/\W+/g, '-')}.pdf`, {type:'application/pdf'});
}

      {okTxt:'Duplicar', onOk: async fm => {

        for (const i of itens) { try { await DB.insert('requisicao_itens', {requisicao_id:nova.id, trabalhador_id:i.trabalhador_id, funcao_id:i.funcao_id}); } catch (e) { falhas.push(e.message); } }

      }});
    ligarCabecalho(m.el);
  };
  if (editavel) await painelAdicionar(r, itens);
}

async function painelAdicionar(r, itens){
  const doDia = (await DB.list('vw_itens', {eq:{data:r.data}})).filter(i => i.status !== 'CANCELADA' && i.requisicao_id !== r.id);
  const turnoR = byId('turnos', r.turno_id), nesta = new Set(itens.map(i => i.trabalhador_id));
  const st = estado.add || (estado.add = {funcao:null, busca:''});
  const funcoes = C.funcoes.filter(f => f.ativo);
  if (!funcoes.some(f => f.id === st.funcao)) st.funcao = funcoes[0] && funcoes[0].id;
  const box = $('#d-add');
  const desenhar = () => {
    const termo = st.busca.toLowerCase();
    const lista = C.trabalhadores.filter(t => t.ativo && funcoesDe(t.id).includes(st.funcao) && !nesta.has(t.id) && (!termo || t.nome.toLowerCase().includes(termo) || byId('empresas', t.empresa_id).nome.toLowerCase().includes(termo)));
    $('#a-lista', box).innerHTML = lista.length ? lista.map(t => {
      const conf = doDia.find(i => i.trabalhador_id === t.id && sobrepoe(turnoR, byId('turnos', i.turno_id)));
      const p = veValores() ? precoVigente(t.empresa_id, st.funcao, r.turno_id, r.tipo_dia, r.data) : null;
      const semPreco = veValores() && !p;
      return `<div class="trab ${conf || semPreco ? 'bloq' : ''}"><div><div class="n">${esc(t.nome)}</div><div class="d">${esc(byId('empresas', t.empresa_id).nome)}${t.cnpj_mei ? ' · MEI ' + esc(t.cnpj_mei) : ''}</div>
        ${conf ? `<div class="aviso">Já escalado no turno ${esc(conf.turno)} · ${reqNum(conf.requisicao_id)}</div>` : ''}${semPreco ? '<div class="aviso">Empresa sem preço para esta função/turno</div>' : ''}</div>
        <div class="lado">${p ? `<span class="mono">${brl(p.valor)}</span>` : ''}<button class="btn peq ${conf || semPreco ? '' : 'primario'}" type="button" data-add="${t.id}" ${conf || semPreco ? 'disabled' : ''}>Adicionar</button></div></div>`;
    }).join('') : `<div class="vazio">Nenhum trabalhador disponível nesta função.${isAdmin() ? ' <a href="#trabalhadores">Cadastrar trabalhador</a>.' : ''}</div>`;
    $$('[data-add]', box).forEach(b => b.onclick = async () => {
      b.disabled = true;
      try { await DB.insert('requisicao_itens', {requisicao_id:r.id, trabalhador_id:+b.dataset.add, funcao_id:st.funcao}); toast('Trabalhador adicionado.'); vDetalhe(r.id); }
      catch (e) { toast(e.message, 1); b.disabled = false; }
    });
  };
  box.innerHTML = `<div class="cab-p"><h2>Adicionar trabalhadores</h2><span class="muted" style="font-size:.85rem">Turno <span class="turno">${esc(r.turno)}</span> · ${fdata(r.data)}</span></div>
    <div style="display:grid;gap:12px">
      <div class="chips" role="group" aria-label="Função">${funcoes.map(f => `<button type="button" class="chip" data-f="${f.id}" aria-pressed="${f.id === st.funcao}">${esc(f.nome)}</button>`).join('')}</div>
      <div class="campo"><label for="a-busca">Buscar por nome ou empresa</label><input id="a-busca" type="search" value="${esc(st.busca)}" placeholder="Digite para filtrar"></div>
      <div class="lista-trab" id="a-lista"></div></div>`;
  $$('[data-f]', box).forEach(b => b.onclick = () => { st.funcao = +b.dataset.f; $$('[data-f]', box).forEach(x => x.setAttribute('aria-pressed', x === b)); desenhar(); });
  $('#a-busca', box).oninput = e => { st.busca = e.target.value; desenhar(); };
  desenhar();
}

/* ------------------------------ Exportação ------------------------------ */
function exportarCSV(itens, nome){
  if (!itens.length) { toast('Nada para exportar nesse filtro.', 1); return; }
  const adm = veValores();
  const cab = ['Requisição','Data','Dia da semana','Tipo de dia','Turno','Horas','Navio','Viagem','Armazém','Trabalhador','CNPJ MEI','Função','Empresa','Supervisor','Situação'].concat(adm ? ['Valor','Fechamento'] : []);
  const q = v => { const s = String(v ?? ''); return /[;"\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const linhas = [...itens].sort((a, b) => a.data.localeCompare(b.data) || a.requisicao_id - b.requisicao_id).map(i => [reqNum(i.requisicao_id), fdata(i.data), DIAS[dow(i.data)], TIPO_DIA[i.tipo_dia], i.turno, i.horas, i.navio, i.viagem, i.armazem, i.trabalhador, i.cnpj_mei, i.funcao, i.empresa, i.supervisor, STATUS[i.status]]
    .concat(adm ? [Number(i.valor || 0).toFixed(2).replace('.', ','), i.fechamento_id ? fecNum(i.fechamento_id) : ''] : []).map(q).join(';'));
  const blob = new Blob(['﻿' + [cab.join(';')].concat(linhas).join('\r\n')], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = nome; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  toast(`${itens.length} linhas exportadas.`);
}

    <div class="filtros"><div class="campo" style="max-width:360px;flex-basis:260px"><label for="cr-b">Buscar</label><input id="cr-b" type="search" value="${esc(st.busca)}"></div></div>

        for (const f of atuais.filter(f => !sel.includes(f))) await DB.remove('trabalhador_funcoes', {trabalhador_id:id, funcao_id:f});
        const novas = sel.filter(f => !atuais.includes(f)); if (novas.length) await DB.insert('trabalhador_funcoes', novas.map(f => ({trabalhador_id:id, funcao_id:f})));
        toast(reg ? 'Trabalhador atualizado.' : 'Trabalhador cadastrado.');
        await carregarCache(['trabalhadores', 'trabalhador_funcoes']); desenhar();
      }});
  };
  $('#t-b').oninput = e => { st.busca = e.target.value; desenhar(); };
  $('#t-e').onchange = e => { st.emp = e.target.value; desenhar(); };
  $('#t-f').onchange = e => { st.fun = e.target.value; desenhar(); };
  $('#t-i').onchange = e => { st.inativos = e.target.checked; desenhar(); };
  if ($('#t-novo')) $('#t-novo').onclick = () => editar(null);
  desenhar();
}

  desenhar();
}

// Diárias aprovadas ainda não fechadas, agrupadas por empresa
function pendentesPorEmpresa(itens){
  const m = new Map();
  for (const i of itens) {
    if (i.status !== 'APROVADA' || i.fechamento_id) continue;
    const g = m.get(i.empresa_id) || {empresa_id:i.empresa_id, empresa:i.empresa, n:0, hh:0, v:0, de:i.data, ate:i.data};
    g.n++; g.hh += i.horas; g.v += Number(i.valor || 0); if (i.data < g.de) g.de = i.data; if (i.data > g.ate) g.ate = i.data;
    m.set(i.empresa_id, g);
  }
  return [...m.values()].sort((a, b) => b.v - a.v);
}

        <div class="caixa"><span class="rot">Sistema</span><b>${brl(f.valor_sistema)}</b><small class="muted">soma das diárias aprovadas</small></div>
        <div class="caixa"><span class="rot">Nota fiscal</span><b>${brl(f.nf_valor)}</b><small class="muted">${f.nf_numero ? 'NF ' + esc(f.nf_numero) + (f.nf_data ? ' · ' + fdata(f.nf_data) : '') : 'não informada'}</small></div>
        <div class="caixa ${f.nf_valor == null ? '' : temDif ? 'dif' : 'ok'}"><span class="rot">Diferença</span><b>${f.nf_valor == null ? '—' : brl(f.diferenca)}</b><small class="muted">${f.nf_valor == null ? 'aguardando NF' : temDif ? 'exige justificativa' : 'NF confere com o sistema'}</small></div>
      </div>
      <form id="fd-form" novalidate style="display:grid;gap:12px;margin-top:14px">
        <div class="grade">
          <div class="campo"><label for="fd-num">Número da NF</label><input id="fd-num" value="${esc(f.nf_numero || '')}" ${emConf ? '' : 'disabled'}></div>
          <div class="campo"><label for="fd-data">Emissão</label><input id="fd-data" type="date" value="${f.nf_data || ''}" ${emConf ? '' : 'disabled'}></div>
          <div class="campo"><label for="fd-valor">Valor da NF (R$)</label><input id="fd-valor" type="number" step="0.01" min="0" value="${f.nf_valor ?? ''}" ${emConf ? '' : 'disabled'}></div>
        </div>
        <div class="campo"><label for="fd-just">Justificativa da diferença</label><textarea id="fd-just" placeholder="Ex.: NF inclui 1 diária de 12/11 lançada fora do sistema" ${emConf ? '' : 'disabled'}>${esc(f.justificativa || '')}</textarea></div>
        <div class="campo"><label for="fd-obs">Observação</label><textarea id="fd-obs">${esc(f.observacao || '')}</textarea></div>
        <div class="erro" id="fd-erro" hidden></div>
        <div class="acoes"><button class="btn" type="submit">Salvar</button></div>
      </form>
    </section>
    <section class="painel"><h2>Por navio</h2><div class="tab-wrap"><table class="tab"><thead><tr><th>Navio</th><th class="num">Diárias</th><th class="num">HH</th><th class="num">Valor</th></tr></thead><tbody>
      ${porNavio.map(g => `<tr><td>${esc(g.navio)}${g.viagem ? ` <span class="muted">· ${esc(g.viagem)}</span>` : ''}</td><td class="num">${n0(g.n)}</td><td class="num">${n0(g.hh)}</td><td class="num">${brl(g.v)}</td></tr>`).join('')}</tbody></table></div></section>
    <section class="painel"><h2>Diárias incluídas</h2><div class="tab-wrap"><table class="tab"><thead><tr><th>Data</th><th>Requisição</th><th>Turno</th><th>Navio</th><th>Trabalhador</th><th>Função</th><th class="num">Valor</th></tr></thead><tbody>
      ${itens.map(i => `<tr><td style="white-space:nowrap">${fdata(i.data)}${i.tipo_dia === 'DOM_FER' ? ' <span class="tag DOM_FER">Dom/fer</span>' : ''}</td><td><a class="reqnum" href="#req-${i.requisicao_id}">${reqNum(i.requisicao_id)}</a></td><td><span class="turno">${esc(i.turno)}</span></td>
        <td>${esc(i.navio)}</td><td>${esc(i.trabalhador)}</td><td>${esc(i.funcao)}</td><td class="num">${brl(i.valor)}</td></tr>`).join('')}</tbody>
      <tfoot><tr><td colspan="6">${n0(itens.length)} diárias</td><td class="num">${brl(f.valor_sistema)}</td></tr></tfoot></table></div></section>`);
  const ler = () => {
    const o = {observacao:$('#fd-obs').value.trim() || null};
    if (emConf) {
      const v = $('#fd-valor').value.trim();
      if (v !== '' && (isNaN(Number(v)) || Number(v) < 0)) throw new Error('Valor da NF inválido.');
      Object.assign(o, {nf_numero:$('#fd-num').value.trim() || null, nf_data:$('#fd-data').value || null, nf_valor:v === '' ? null : Number(v), justificativa:$('#fd-just').value.trim() || null});
    }
    return o;
  };
  const acao = async (patch, msg) => { const e = $('#fd-erro'); e.hidden = true; try { await DB.update('fechamentos', {id}, patch); toast(msg); vFechamento(id); } catch (x) { e.textContent = x.message; e.hidden = false; toast(x.message, 1); } };
  $('#fd-form').addEventListener('submit', e => { e.preventDefault(); try { acao(ler(), 'Fechamento salvo.'); } catch (x) { $('#fd-erro').textContent = x.message; $('#fd-erro').hidden = false; } });
  if ($('#fd-conf')) $('#fd-conf').onclick = () => { try { acao({...ler(), status:'CONFERIDO'}, 'Fechamento conferido.'); } catch (x) { toast(x.message, 1); } };
  if ($('#fd-voltar')) $('#fd-voltar').onclick = () => acao({status:'EM_CONFERENCIA'}, 'Fechamento voltou para conferência.');
  if ($('#fd-estornar')) $('#fd-estornar').onclick = () => confirmar('Estornar pagamento', 'O fechamento volta para "Conferido" e a data de pagamento é apagada.', 'Estornar', async () => { await DB.update('fechamentos', {id}, {status:'CONFERIDO'}); toast('Pagamento estornado.'); vFechamento(id); }, true);
  if ($('#fd-pagar')) $('#fd-pagar').onclick = () => modal('Registrar pagamento', `<p class="muted" style="margin:0">${esc(f.empresa)} · NF ${esc(f.nf_numero || '')} · ${brl(f.nf_valor)}</p>
    <div class="campo"><label for="pg-data">Data do pagamento *</label><input type="date" id="pg-data" value="${hoje()}"></div>`, {okTxt:'Registrar pagamento', onOk: async fm => {
      const d = $('#pg-data', fm).value; if (!d) throw new Error('Informe a data do pagamento.');
      await DB.update('fechamentos', {id}, {status:'PAGO', data_pagamento:d}); toast('Pagamento registrado.'); vFechamento(id); }});
  if ($('#fd-desf')) $('#fd-desf').onclick = () => confirmar('Desfazer fechamento', `As ${f.qtd_diarias} diárias voltam para "a fechar" e as requisições são destravadas.`, 'Desfazer', async () => { await DB.rpc('desfazer_fechamento', {p_id:id}); toast(fecNum(id) + ' desfeito.'); location.hash = 'fechamentos'; }, true);
  $('#fd-csv').onclick = () => exportarCSV(itens, `${fecNum(id)}_${f.empresa}.csv`.replace(/[^\w.-]+/g, '_'));
}

boot();
</script>
</body>
</html>
